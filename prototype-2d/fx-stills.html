<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>fx-stills diagnostic (temp)</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:16px}table{border-collapse:collapse}td,th{border:1px solid #444;padding:4px 8px;text-align:right}td:first-child,th:first-child{text-align:left}.ok{color:#8f8}.bad{color:#f88}</style>
</head><body>
<h2>Skill FX strips served from pinned cecaed3 — painted-pixel probe (temp diagnostic page)</h2>
<p id="status">loading…</p>
<table id="t"><tr><th>strip</th><th>size</th><th>frames painted px (6 cells)</th><th>total</th></tr></table>
<script>
const BASE = 'https://rawcdn.githack.com/xa1217/XiYou_Roguelike/cecaed3/prototype-2d/assets/';
const STRIPS = ['slash-arc','light-orb','rake-sweep','water-ring','fan-wave','gourd-vortex','palm-burst','fire-wheel','ring-spin','gold-bead','fire-pool','monkey-clone','whirl-pool','fire-bird','mountain-slam','skull-bead','holy-spark'];
const CELL = 256, FRAMES = 6;
const cv = document.createElement('canvas'); cv.width = CELL; cv.height = CELL;
const cx = cv.getContext('2d', { willReadFrequently: true });
const rows = [];
async function probe(id) {
  const img = new Image(); img.crossOrigin = 'anonymous';
  const src = BASE + 'skill-fx-' + id + '.png';
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = src; });
  const per = [];
  for (let f = 0; f < FRAMES; f++) {
    cx.clearRect(0, 0, CELL, CELL);
    cx.drawImage(img, f * CELL, 0, CELL, CELL, 0, 0, CELL, CELL);
    const d = cx.getImageData(0, 0, CELL, CELL).data;
    let n = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i] + d[i+1] + d[i+2] > 60) n++;
    per.push(n);
  }
  return { id, size: img.naturalWidth + 'x' + img.naturalHeight, per, total: per.reduce((a,b)=>a+b,0) };
}
(async () => {
  const tb = document.getElementById('t');
  for (const id of STRIPS) {
    try {
      const r = await probe(id);
      rows.push(r);
      const tr = document.createElement('tr');
      const allPainted = r.per.every(v => v > 0) && r.size === '1536x256';
      tr.innerHTML = '<td>' + r.id + '</td><td>' + r.size + '</td><td>' + r.per.join(', ') + '</td><td class="' + (allPainted ? 'ok' : 'bad') + '">' + r.total + '</td>';
      tb.appendChild(tr);
    } catch (e) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + id + '</td><td colspan="3" class="bad">LOAD FAILED</td>';
      tb.appendChild(tr);
    }
  }
  document.getElementById('status').textContent = 'done: ' + rows.length + '/' + STRIPS.length + ' strips loaded; all 6 frames painted = OK';
})();
</script>
</body></html>
