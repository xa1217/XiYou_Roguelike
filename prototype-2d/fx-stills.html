<!doctype html>
<meta charset="utf-8">
<title>fx diagnostic</title>
<body style="background:#20242a;color:#eee;font:14px monospace">
<div id="log">loading…</div>
<canvas id="cv" width="390" height="560" style="background:#3d4a35;display:block;margin-top:8px"></canvas>
<script type="module">
import { GameRenderer } from './src/renderer.js';
import { attachSkillFx, skillFxFrameRect } from './src/skill-fx-animation.js';
const FILES = { 'slash-arc':'skill-fx-slash-arc.png','light-orb':'skill-fx-light-orb.png','rake-sweep':'skill-fx-rake-sweep.png','water-ring':'skill-fx-water-ring.png','fan-wave':'skill-fx-fan-wave.png','gourd-vortex':'skill-fx-gourd-vortex.png','palm-burst':'skill-fx-palm-burst.png','fire-burst':'skill-fx-fire-burst.png','fire-wheel':'skill-fx-fire-wheel.png','ring-spin':'skill-fx-ring-spin.png','gold-bead':'skill-fx-gold-bead.png','fire-pool':'skill-fx-fire-pool.png' };
const log = [];
const images = {};
await Promise.all(Object.entries(FILES).map(([id, file]) => new Promise((resolve) => {
  const img = new Image();
  img.onload = () => { const ok = !!attachSkillFx(img, id); if (ok) images[id] = img; log.push(`${id}: loaded ${img.naturalWidth}x${img.naturalHeight} attach=${ok} rect=${!!(ok && skillFxFrameRect(img, .5))}`); resolve(); };
  img.onerror = () => { log.push(`${id}: LOAD ERROR`); resolve(); };
  img.src = `./assets/${file}`;
})));
const canvas = document.getElementById('cv');
const renderer = new GameRenderer(canvas, { width: 390, height: 560, pixelRatio: 1, showHud: false, skillFxImages: images });
renderer.elapsed = 1.05;
const ctx = canvas.getContext('2d');
// count drawImage calls per item by wrapping
let draws = 0; const orig = ctx.drawImage.bind(ctx); ctx.drawImage = (...a) => { draws += 1; return orig(...a); };
const probe = (label, fn) => { draws = 0; ctx.save(); fn(); ctx.restore(); log.push(`${label}: drawImage=${draws}`); };
probe('projectile ring r12', () => renderer._drawProjectile(ctx, { x: 70, y: 80, vx: 100, vy: 0, radius: 12, kind: 'ring', color: '#e7cb75' }));
probe('projectile ring-child r8', () => renderer._drawProjectile(ctx, { x: 170, y: 80, vx: -60, vy: 40, radius: 8, kind: 'ring-child', color: '#e7cb75' }));
probe('projectile fire-wheel r16', () => renderer._drawProjectile(ctx, { x: 280, y: 80, vx: 100, vy: 0, radius: 16, kind: 'fire-wheel', color: '#f3873c' }));
probe('effect fan', () => renderer._drawEffect(ctx, { x: 90, y: 230, radius: 120, kind: 'fan', ttl: .175, maxTtl: .35, angle: 0, color: '#68c2aa' }));
probe('effect bead', () => renderer._drawEffect(ctx, { x: 250, y: 220, radius: 10, kind: 'bead', ttl: 5, maxTtl: 6.1, angle: 0, color: '#d9b77b' }));
probe('effect fire-trail', () => renderer._drawEffect(ctx, { x: 320, y: 240, radius: 14, kind: 'fire-trail', ttl: 2, maxTtl: 3, angle: 0, color: '#ef7650' }));
probe('effect gourd', () => renderer._drawEffect(ctx, { x: 90, y: 420, radius: 150, kind: 'gourd', ttl: 2, maxTtl: 2.4, angle: 0, color: '#a879cb' }));
probe('effect palm-strike', () => renderer._drawEffect(ctx, { x: 250, y: 400, radius: 40, kind: 'palm-strike', ttl: .25, maxTtl: .5, angle: .8, color: '#e7cb80', delay: .3 }));
probe('effect mountain post-delay', () => renderer._drawEffect(ctx, { x: 330, y: 430, radius: 60, kind: 'mountain', ttl: .2, maxTtl: .8, delay: .45, angle: 0, color: '#b58d65' }));
document.getElementById('log').innerText = log.join('\n');
</script>
</body>
