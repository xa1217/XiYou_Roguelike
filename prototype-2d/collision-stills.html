<!doctype html>
<meta charset="utf-8">
<title>scene collision probes</title>
<body style="background:#111;color:#7f7;font:14px monospace;white-space:pre-wrap">
<div id="out">running…</div>
<script type="module">
import { GameEngine } from './src/engine.js';
import { sceneCircleBlocked } from './src/scene-collision.js';
const lines = [];
const W = 1800;
const BLOCKED = {
  water: [[900, 90], [200, 450], [900, 1650], [1500, 1450], [90, 900]],
  fire: [[900, 110], [90, 700], [900, 1620], [700, 1330], [1500, 1300], [1710, 800]],
  sand: [[900, 130], [300, 500], [1240, 1480], [1500, 300], [300, 1400]],
  snow: [[900, 130], [300, 500], [1240, 1480], [1560, 300], [200, 1300]],
  forest: [[900, 110], [110, 700], [1350, 1520], [830, 1620], [90, 1500]],
  temple: [[900, 110], [110, 700], [1350, 1520], [830, 1620], [90, 1500]],
};
const OPEN = {
  water: [[900, 900], [700, 700], [1100, 1000], [300, 900], [250, 1520], [900, 500]],
  fire: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [900, 500]],
  sand: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [250, 1600]],
  snow: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [1400, 500]],
  forest: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [300, 1550]],
  temple: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [300, 1550]],
};
let fails = 0;
for (const key of Object.keys(BLOCKED)) {
  for (const [x, y] of BLOCKED[key]) { const b = sceneCircleBlocked(key, x, y, 14, W); if (!b) fails++; lines.push(`${key} blocked (${x},${y}): ${b ? 'OK' : 'FAIL'}`); }
  for (const [x, y] of OPEN[key]) { const b = sceneCircleBlocked(key, x, y, 14, W); if (b) fails++; lines.push(`${key} open (${x},${y}): ${!b ? 'OK' : 'FAIL'}`); }
}
// Engine-level: fire stage dash cannot tunnel the ruin wall.
const engine = new GameEngine({ characterId: 'wukong', stageId: 10, seed: 7 });
const p = engine.state.player;
Object.assign(p, { x: 600, y: 1330 });
let dashOk = true;
for (let i = 0; i < 6; i++) { engine.useDash({ x: 1, y: 0 }); p.dashCooldown = 0; if (!engine.isWalkable(p.x, p.y, p.radius) || p.x >= 666) dashOk = false; }
lines.push(`fire dash wall-stop: ${dashOk ? 'OK' : 'FAIL'} (final x=${p.x.toFixed(0)})`);
if (!dashOk) fails++;
// Engine-level: water stage walk north stops at the river shore.
const w = new GameEngine({ characterId: 'wukong', stageId: 3, seed: 7 });
Object.assign(w.state.player, { x: 900, y: 900 });
for (let i = 0; i < 240; i++) w.movePlayer(0, -6);
lines.push(`water north walk stops at shore: ${w.state.player.y > 300 ? 'OK' : 'FAIL'} (y=${w.state.player.y.toFixed(0)})`);
if (!(w.state.player.y > 300)) fails++;
// Doublefork ridge regression.
const d = new GameEngine({ characterId: 'wukong', stageId: 1, seed: 7 });
const ridgeOk = !d.isWalkable(300, 900, 14) && d.isWalkable(900, 900, 14) && d.isWalkable(300, 300, 14);
lines.push(`doublefork ridge rule intact: ${ridgeOk ? 'OK' : 'FAIL'}`);
if (!ridgeOk) fails++;
lines.push(fails === 0 ? 'ALL PROBES OK' : `${fails} PROBES FAILED`);
document.getElementById('out').textContent = lines.join('\n');
</script>
</body>
