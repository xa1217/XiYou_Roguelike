<!doctype html>
<meta charset="utf-8">
<title>scene collision probes</title>
<pre id="out">running…</pre>
<script type="module">
import { GameEngine } from './src/engine.js';
import { sceneCircleBlocked, caveMouthsFor } from './src/scene-collision.js';

const out = [];
const W = 1800;
const BLOCKED = {
  water: [[900, 90], [200, 450], [900, 1650], [1500, 1450], [90, 900]],
  fire: [[900, 110], [90, 700], [900, 1620], [700, 1330], [1500, 1300], [1710, 800]],
  sand: [[900, 130], [300, 500], [900, 90], [1240, 1480], [1500, 300], [300, 1400]],
  snow: [[900, 130], [300, 500], [1240, 1480], [1560, 300], [200, 1300], [900, 130]],
  forest: [[900, 110], [110, 700], [1350, 1520], [830, 1620], [90, 1500]],
  temple: [[900, 110], [110, 700], [1350, 1520], [830, 1620], [90, 1500]],
};
const OPEN = {
  water: [[900, 900], [700, 700], [1100, 1000], [300, 900], [250, 1520], [900, 500]],
  fire: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [900, 500]],
  sand: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [250, 1600]],
  snow: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [1400, 500]],
  forest: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [300, 1550]],
  temple: [[900, 900], [700, 700], [1100, 1000], [500, 900], [1300, 900], [300, 1550]],
};
let fails = 0;
for (const key of Object.keys(BLOCKED)) {
  for (const [x, y] of BLOCKED[key]) {
    const blocked = sceneCircleBlocked(key, x, y, 14, W);
    if (!blocked) { fails++; out.push(`FAIL ${key} (${x},${y}) should be BLOCKED`); }
  }
  for (const [x, y] of OPEN[key]) {
    const blocked = sceneCircleBlocked(key, x, y, 14, W);
    if (blocked) { fails++; out.push(`FAIL ${key} (${x},${y}) should be OPEN`); }
  }
  out.push(`theme ${key}: probes done`);
}

// Doublefork: ridge rule + side massifs + sky strip (engine level).
{
  const e = new GameEngine({ characterId: 'wukong', stageId: 1, seed: 7, debug: true });
  const cases = [
    [90, 900, false, 'west massif'], [1710, 900, false, 'east massif'],
    [900, 40, false, 'sky strip'], [150, 150, false, 'NW peaks'],
    [300, 900, false, 'ridge off-pass'], [700, 300, true, 'north floor'],
    [900, 900, true, 'stone pass'], [900, 1500, true, 'south floor'],
  ];
  for (const [x, y, want, label] of cases) {
    const got = e.isWalkable(x, y, 14);
    if (got !== want) { fails++; out.push(`FAIL doublefork ${label} (${x},${y}) want ${want} got ${got}`); }
  }
  const p = e.state.player;
  Object.assign(p, { x: 900, y: 900 });
  for (let i = 0; i < 260; i++) e.movePlayer(0, -6);
  if (!(p.y > 30 && p.y < 220)) { fails++; out.push(`FAIL doublefork north walk stopped at y=${p.y}`); }
  else out.push(`doublefork north walk stopped under sky at y=${Math.round(p.y)}`);
  Object.assign(p, { x: 900, y: 1300 });
  for (let i = 0; i < 200; i++) e.movePlayer(-6, 0);
  if (!(p.x > 380 && p.x < 560)) { fails++; out.push(`FAIL doublefork west walk stopped at x=${p.x}`); }
  else out.push(`doublefork west walk stopped at massif x=${Math.round(p.x)}`);
  e.dispose();
}

// Cave mouths: open at spawn radius, rock within reach (all themes).
for (const key of ['water', 'fire', 'sand', 'snow', 'forest', 'temple']) {
  for (const [x, y] of caveMouthsFor(key)) {
    if (sceneCircleBlocked(key, x, y, 24, W)) { fails++; out.push(`FAIL cave ${key} (${x},${y}) not open`); }
    if (!sceneCircleBlocked(key, x, y, 95, W)) { fails++; out.push(`FAIL cave ${key} (${x},${y}) not at rock foot`); }
  }
}
out.push('cave mouth probes done');

// Engine walks on theme stages: dash into a wall, walk into a shore.
{
  const fire = new GameEngine({ characterId: 'wukong', stageId: 10, seed: 11, debug: true });
  Object.assign(fire.state.player, { x: 600, y: 1330 });
  for (let i = 0; i < 6; i++) fire.useDash(1, 0);
  const fx = fire.state.player.x;
  if (!(fx > 560 && fx < 660)) { fails++; out.push(`FAIL fire dash wall stop x=${fx}`); }
  else out.push(`fire dash stopped at wall x=${Math.round(fx)}`);
  fire.dispose();
  const water = new GameEngine({ characterId: 'wukong', stageId: 3, seed: 11, debug: true });
  const wp = water.state.player;
  for (let i = 0; i < 200; i++) water.movePlayer(0, -6);
  if (!(wp.y > 300)) { fails++; out.push(`FAIL water north walk y=${wp.y}`); }
  else out.push(`water north walk stopped at shore y=${Math.round(wp.y)}`);
  water.dispose();
}

// Cave spawns on a production engine (stage 1).
{
  const e = new GameEngine({ characterId: 'wukong', stageId: 1, seed: 1234 });
  const mouths = caveMouthsFor('doublefork').map(([x, y]) => `${x},${y}`);
  let hits = 0;
  for (let i = 0; i < 120; i++) {
    const point = e.spawnPoint(true);
    if (!e.isWalkable(point.x, point.y, 24)) { fails++; out.push('FAIL cave spawn landed unwalkable'); break; }
    if (mouths.includes(`${point.x},${point.y}`)) hits++;
  }
  if (hits < 25) { fails++; out.push(`FAIL cave spawn hits ${hits}/120`); }
  else out.push(`cave spawns: ${hits}/120 from cave mouths`);
  e.dispose();
}

out.push(fails === 0 ? 'ALL PROBES OK' : `${fails} PROBE FAILURES`);
document.getElementById('out').textContent = out.join('\n');
document.title = fails === 0 ? 'PROBES OK' : 'PROBES FAIL';
</script>
