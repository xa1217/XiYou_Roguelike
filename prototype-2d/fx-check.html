<!doctype html>
<meta charset="utf-8">
<title>skill fx check</title>
<body style="margin:0;background:#2b2118">
<div id="status" style="color:#ffe9a8;font:16px monospace;padding:8px">loading strips…</div>
<canvas id="stage" width="1170" height="900" style="display:block"></canvas>
<script type="module">
import { GameRenderer } from './src/renderer.js';
import { attachSkillFx } from './src/skill-fx-animation.js';

const status = document.getElementById('status');
const canvas = document.getElementById('stage');
const ids = ['slash-arc', 'light-orb', 'rake-sweep', 'water-ring'];
const images = {};
await Promise.all(ids.map((id) => new Promise((resolve) => {
  const image = new Image();
  image.onload = () => { if (attachSkillFx(image, id)) images[id] = image; resolve(); };
  image.onerror = () => resolve();
  image.src = `./assets/skill-fx-${id}.png`;
})));
const attached = ids.filter((id) => images[id]);
status.textContent = `attached ${attached.length}/4: ${attached.join(', ') || 'none'}`;

const renderer = new GameRenderer(canvas, { width: 1170, height: 900, skillFxImages: images });
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#7a603e'; ctx.fillRect(0, 0, 1170, 900);
ctx.fillStyle = '#8a6c46'; ctx.fillRect(0, 0, 1170, 900);
// A fake hero anchor at each cell center so effects read in context.
function heroAt(x, y) {
  ctx.fillStyle = '#e8b23a'; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5b3a1e'; ctx.beginPath(); ctx.arc(x, y - 20, 9, 0, Math.PI * 2); ctx.fill();
}
const rows = [
  { kind: 'sweep', label: 'WUKONG SWEEP', color: '#e6a43a', radius: 95 },
  { kind: 'hoe-line', label: 'BAJIE RAKE', color: '#d98a4a', radius: 95, width: 44, length: 190 },
  { kind: 'staff-ring', label: 'WUJING RING', color: '#8bb8bf', radius: 80 },
];
const progresses = [0.08, 0.45, 0.85];
rows.forEach((row, r) => {
  progresses.forEach((p, c) => {
    const x = 195 + c * 390, y = 170 + r * 260;
    heroAt(x, y);
    renderer._drawEffect(ctx, {
      x, y, kind: row.kind, radius: row.radius, width: row.width, length: row.length,
      angle: -0.5, color: row.color, ttl: (1 - p) * 0.2, maxTtl: 0.2,
    });
    ctx.fillStyle = '#ffe9a8'; ctx.font = '15px monospace'; ctx.fillText(`${row.label} p=${p}`, x - 90, y + 130);
  });
});
// Light-orb projectiles row (renderer time drives the pulse).
renderer.elapsed = 0.31;
for (let c = 0; c < 3; c += 1) {
  const x = 195 + c * 390, y = 170 + 3 * 260;
  renderer._drawProjectile(ctx, { x, y, vx: 200, vy: 0, radius: 13, kind: 'light-orb', color: '#35d7ff' });
  ctx.fillStyle = '#ffe9a8'; ctx.font = '15px monospace'; ctx.fillText('SANZANG LIGHT-ORB', x - 90, y + 60);
  renderer.elapsed += 0.21;
}
status.textContent += ' — drawn';
</script>
</body>
